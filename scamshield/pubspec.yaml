name: scamshield
description: ScamShield - digital fraud defence.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Riverpod keeps application state outside widgets and makes dependencies
  # explicit, testable and easy to replace as ScamShield grows.
  flutter_riverpod: ^2.6.1

  # go_router gives the app declarative navigation, deep-link support and a
  # clean path to web/mobile routes without scattering Navigator calls around.
  go_router: ^14.8.1

  # Small cross-platform HTTP client used only for optional consented cloud
  # analysis. No API secret is embedded in the app; production authentication
  # belongs on the backend.
  http: ^1.2.2

  # Lets users select screenshots from gallery/files on mobile and web.
  # 1.1.2 keeps compatibility with the Dart 3 generation used by this project.
  image_picker: ^1.1.2

  # Client-side OCR. Screenshot text is extracted locally where the platform
  # supports Tesseract, rather than uploading private messages to a server.
  flutter_tesseract_ocr: ^0.4.31

  # Pure-Dart image decoding used before QR analysis.
  # Pin 4.5.1 because it supports archive 3.x, which is also compatible with
  # pdf 3.11.x on this project's Dart 3.6.x / Flutter SDK.
  image: 4.5.1

  # Pure-Dart QR decoder. This keeps QR inspection local and works on web too.
  zxing2: ^0.2.4

  # Evidence Locker metadata is stored locally so incident summaries survive
  # restarts without requiring an account or backend. Large screenshot bytes
  # are intentionally not stored in preferences.
  shared_preferences: ^2.5.3

  # Generates professional multi-page incident reports entirely on-device.
  # 3.11.3 is compatible with this Flutter SDK's pinned vector_math 2.1.4,
  # while newer pdf releases require vector_math 2.2.0.
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
