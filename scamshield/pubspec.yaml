name: scamshield
description: ScamShield - digital fraud defence.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Riverpod keeps application state outside widgets and makes dependencies
  # explicit, testable and easy to replace as ScamShield grows.
  flutter_riverpod: ^2.6.1

  # go_router gives the app declarative navigation, deep-link support and a
  # clean path to web/mobile routes without scattering Navigator calls around.
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
